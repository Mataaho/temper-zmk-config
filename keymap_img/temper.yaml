layout: {zmk_keyboard: temper}
layers:
  alpha:
  - - Q
    - W
    - F
    - P
    - B
    - J
    - L
    - U
    - Y
    - {t: ';', s: ':'}
  - [A, R, S, T, G, M, N, E, I, O]
  - - X
    - C
    - D
    - V
    - Z
    - K
    - H 
    - {t: ',', s: '<'}
    - {t: ., s: '>'}
    - {t: /, s: '?'}
  - - {t: CTRL, h: ESC}
    - {t: TAB, h: LSHIFT}
    - {t: SPACE, h: 1}
    - {t: ENTER, h: 2}
    - {t: BKSP, h: LALT}
    - {t: LGUI, h: DEL}
  symnum:
  - ['=', '7', '8', '9', '0', {t: ▽, type: trans}, '(', ')', '-', ';']
  - - '*'
    - '4'
    - '5'
    - '6'
    - '+'
    - HOME
    - RSHIFT
    - '`'
    - '\'
    - END
  - - '/'
    - '1'
    - '2'
    - '3'
    - '-'
    - {t: ▽, type: trans}
    - '['
    - ']'
    - '''
    - {t: ▽, type: trans}
  - - GUI
    - LSHIFT
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - RCTRL
    - RGUI
  nav:
  - [LCTRL, LGUI, LALT, LSHIFT, {t: ▽, type: trans}, &msc SCRL_RIGHT, &msc SCRL_LEFT, &kp PP, &kp STOP, {t: ▽, type: trans}]
  - - Bright up
    - Vol+
    - MUTE
    - BKSP
    - DEL
    - PAGE UP
    - LEFT
    - RIGHT
    - UP
    - DOWN
  - - Bright DN
    - Vol-
    - {t: ▽, type: trans}
    - &mkp MB1 
    - &mkp MB2 
    - PAGE DOWN
    - &mmv LEFT 
    - &mmv RIGHT
    - &mmv UP
    - &mmv DOWN
  - - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
  func:
  - - LCTRL
    - LGUI
    - LALT
    - LSHIFT
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - F7 
    - F8 
    - F9 
    - F12
  - - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - F4 
    - F5 
    - F6 
    - F11
  - - BT0
    - BT1
    - BT2
    - BT3
    - BT4
    - {t: ▽, type: trans}
    - F1 
    - F2 
    - F3 
    - F10 
  - - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - USB OUT
    - BT OUT 
    - BT CLEAR
    - {t: ▽, type: trans}
    - {t: ▽, type: trans} 
    - {t: ▽, type: trans} 
    - {t: ▽, type: trans} 
    - {t: ▽, type: trans} 
